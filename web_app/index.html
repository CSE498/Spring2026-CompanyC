<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Company C</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #1a1a2e;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        color: #e8e8e8;
      }
      #root {
        position: relative;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      #canvas-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #content {
        position: relative;
        z-index: 1;
        width: 600px;
        min-height: 450px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="canvas-bg"></div>
      <div id="content"></div>
    </div>

    <script>
      var Module = {
        onRuntimeInitialized: function () {
          Module._RunWebInterface();
        }
      };
    </script>
    <script src="app.js"></script>
  </body>
</html>
